<!DOCTYPE html>
<html>
<head>
<style>
button {
  background-color: blue;
  color: white;
  padding: 12px 24px;
  border: none;
  font-size: 18px;
  cursor: pointer;

  /* Transition */
  transition: background-color 0.5s ease,
              transform 0.3s ease;
}

/* Hover Effect */
button:hover {
  background-color: red;
  transform: scale(1.1);
}
</style>
</head>

<body>

<button>Hover Me</button>

</body>
</html>
