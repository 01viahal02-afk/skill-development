<!DOCTYPE html>
<html>
<head>
  <style>
    .box {
      width: 200px;
      height: 100px;

      /* Content background */
      background-color: lightblue;

      /* Padding */
      padding: 20px;

      /* Border */
      border: 5px solid blue;

      /* Margin */
      margin: 30px;

      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="box">
    CSS Box Model Example
  </div>

</body>
</html>
