<!DOCTYPE html>
<html>
<head>
<style>
body {
  font-family: Arial;
  margin: 20px;
}

.cards {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.card {
  flex: 1 1 250px;
  border: 1px solid #ccc;
  border-radius: 10px;
  padding: 20px;
  background: #fafafa;
}

.card h3 {
  margin-top: 0;
}
</style>
</head>

<body>

<div class="cards">

  <div class="card">
    <h3>Card 1</h3>
    <p>Sample text here.</p>
  </div>

  <div class="card">
    <h3>Card 2</h3>
    <p>Sample text here.</p>
  </div>

  <div class="card">
    <h3>Card 3</h3>
    <p>Sample text here.</p>
  </div>

</div>

</body>
</html>
